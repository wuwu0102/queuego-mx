<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QueueGo MX - Ahorra tiempo en filas en Guadalajara"
    />
    <title>QueueGo MX</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 520px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 16px 0 32px;
        font-size: clamp(1rem, 4.5vw, 1.25rem);
        line-height: 1.5;
      }

      .cta {
        display: inline-block;
        border: 1px solid #fff;
        border-radius: 999px;
        padding: 14px 26px;
        color: #000;
        background: #fff;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        transition: opacity 0.2s ease;
      }

      .cta:hover,
      .cta:focus-visible {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QueueGo MX</h1>
      <p>Ahorra tiempo en filas en Guadalajara</p>
      <a class="cta" href="https://m.me/queuegomx">Enviar mensaje</a>
    </main>
  </body>
</html>
